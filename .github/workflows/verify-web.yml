name: Verify Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm test:themes
      - run: pnpm --filter @template/web lint
      - run: pnpm build
      - run: pnpm build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /ui_template
          PAGES_PASSWORD: ci-preview-check
